version: '3.9'

services:
  postgres-pedidos:
    image: postgres:15
    container_name: postgres-pedidos
    restart: always
    environment:
      POSTGRES_DB: pedidos_db
      POSTGRES_USER: Harolito
      POSTGRES_PASSWORD: 1234
    ports:
      - "5434:5432"
    volumes:
      - pedidos_data:/var/lib/postgresql/data

volumes:
  pedidos_data:

